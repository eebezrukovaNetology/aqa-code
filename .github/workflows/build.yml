
name: Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: 11

      - name: Start application
        run: java -jar ./artifacts/app-mbank.jar > app.log 2>&1 &

      - name: Wait for application
        run: |
          for i in {1..30}; do
            if curl -sS http://localhost:9999/api/v1 >/dev/null; then
              echo "Application is running"
              exit 0
            fi
            sleep 1
          done
          cat app.log
          exit 1

      - name: Run tests
        working-directory: api-ci/rest
        run: ./gradlew test
